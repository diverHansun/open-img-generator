name: Windows x64

on:
  pull_request:
  push:
    branches:
      - main
      - mvp

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.x
          architecture: x64
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:verify
      - run: npm run build
      - run: npm run test:smoke:windows
